<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <style>
    .board{fill:#176b4d;stroke:#0a2e22;stroke-width:6}
    .part{fill:#e9eef2;stroke:#18232c;stroke-width:3}
    .power{fill:#f1ad55}.memory{fill:#9eb9f5}.io{fill:#f5df73}.debug{fill:#dd9ee8}
    .label{font:700 22px system-ui,sans-serif;fill:#101820;text-anchor:middle}
    .small{font:16px system-ui,sans-serif;fill:#101820;text-anchor:middle}
    .medium{font:700 18px system-ui,sans-serif;fill:#101820;text-anchor:middle}
    .vertical{font:700 17px system-ui,sans-serif;fill:#101820;text-anchor:middle}
    .note{font:18px system-ui,sans-serif;fill:#24323b}
    .hole{fill:#d8c78d;stroke:#39321c;stroke-width:3}
  </style>
  <rect width="1000" height="760" fill="#f6f8fa"/>
  <text x="50" y="42" class="note">Avaota A1-derived Android box - Rev-P1 floorplan (mechanical dimensions provisional)</text>
  <rect x="50" y="80" width="900" height="600" rx="12" class="board"/>
  <circle cx="90" cy="120" r="14" class="hole"/><circle cx="910" cy="120" r="14" class="hole"/>
  <circle cx="90" cy="640" r="14" class="hole"/><circle cx="910" cy="640" r="14" class="hole"/>
  <rect x="410" y="285" width="170" height="170" class="part"/>
  <text x="495" y="360" class="label">U1 A527/T527</text><text x="495" y="388" class="small">BGA664 + heatsink</text>
  <rect x="610" y="300" width="150" height="110" class="part memory"/>
  <text x="685" y="348" class="label">U4 LPDDR4</text><text x="685" y="377" class="small">2 GB baseline</text>
  <rect x="420" y="500" width="145" height="100" class="part memory"/>
  <text x="492" y="542" class="label">U5 eMMC</text><text x="492" y="570" class="small">32/64 GB HS400</text>
  <rect x="205" y="270" width="130" height="115" class="part power"/>
  <text x="270" y="318" class="medium">U2 AXP717</text><text x="270" y="347" class="small">Avaota core PMIC</text>
  <rect x="220" y="425" width="115" height="90" class="part power"/>
  <text x="278" y="462" class="medium">U3 AXP323</text><text x="278" y="490" class="small">Avaota CPU PMIC</text>
  <rect x="180" y="625" width="180" height="70" class="part io"/>
  <text x="270" y="660" class="medium">USB-C PD POWER</text><text x="270" y="683" class="small">9 V / 3 A PD</text>
  <rect x="405" y="625" width="155" height="70" class="part io"/>
  <text x="482" y="660" class="medium">USB-C HOST</text><text x="482" y="683" class="small">USB 2.0 x1</text>
  <rect x="600" y="625" width="190" height="70" class="part io"/>
  <text x="695" y="660" class="medium">HDMI TYPE-A</text><text x="695" y="683" class="small">horizontal / right-angle</text>
  <rect x="765" y="485" width="120" height="65" class="part debug"/>
  <text x="825" y="525" class="label">J2 UART</text>
  <rect x="765" y="540" width="120" height="65" class="part debug"/>
  <text x="825" y="580" class="label">J3 JTAG</text>
  <rect x="120" y="555" width="95" height="52" class="part debug"/><text x="167" y="588" class="label">FEL</text>
  <rect x="230" y="555" width="115" height="52" class="part debug"/><text x="287" y="588" class="label">RESET</text>
  <text x="50" y="725" class="note">Same edge: USB-C PD power, one USB-C host, horizontal HDMI. Use measured enclosure datums before Rev-A.</text>
</svg>
