<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440">
  <style>
    .bg{fill:#f5f7fa}.block{fill:#fff;stroke:#263442;stroke-width:3;rx:14}
    .done{fill:#d9f4e5;stroke:#18794e}.next{fill:#fff4ce;stroke:#9a6700}
    .rail{fill:none;stroke:#be123c;stroke-width:7;marker-end:url(#arrow)}
    .ctrl{fill:none;stroke:#2563eb;stroke-width:4;stroke-dasharray:10 7;marker-end:url(#blue-arrow)}
    .title{font:700 24px system-ui,sans-serif;fill:#111827;text-anchor:middle}
    .text{font:17px system-ui,sans-serif;fill:#243244;text-anchor:middle}
    .small{font:15px system-ui,sans-serif;fill:#475569;text-anchor:middle}
    .legend{font:16px system-ui,sans-serif;fill:#334155}
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#be123c"/></marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="440" class="bg"/>
  <text x="600" y="38" class="title">J5 USB-C PD power path — current routing state</text>

  <rect x="35" y="105" width="175" height="120" class="block done"/>
  <text x="122" y="145" class="title">J5 USB-C</text>
  <text x="122" y="178" class="text">VBUS + CC1/CC2</text>
  <text x="122" y="205" class="small">power-only receptacle</text>

  <rect x="275" y="105" width="195" height="120" class="block done"/>
  <text x="372" y="145" class="title">U1001</text>
  <text x="372" y="178" class="text">STUSB4500 sink</text>
  <text x="372" y="205" class="small">requests PDO2: 9 V / 3 A</text>

  <rect x="535" y="90" width="215" height="150" class="block next"/>
  <text x="642" y="130" class="title">U1002 eFuse</text>
  <text x="642" y="163" class="text">TPS259470L</text>
  <text x="642" y="192" class="small">dV/dt + timer + 3.33 A ILM routed</text>
  <text x="642" y="217" class="small">EN / OVLO gate is next</text>

  <rect x="815" y="105" width="155" height="120" class="block done"/>
  <text x="892" y="145" class="title">D2 / Q1</text>
  <text x="892" y="178" class="text">input protection</text>
  <text x="892" y="205" class="small">existing handoff</text>

  <rect x="1030" y="105" width="140" height="120" class="block done"/>
  <text x="1100" y="145" class="title">5 V buck</text>
  <text x="1100" y="178" class="text">TPS54531</text>
  <text x="1100" y="205" class="small">system rail</text>

  <path d="M210 165 H275" class="rail"/><path d="M470 165 H535" class="rail"/>
  <path d="M750 165 H815" class="rail"/><path d="M970 165 H1030" class="rail"/>

  <rect x="315" y="300" width="235" height="90" class="block next"/>
  <text x="432" y="335" class="title">PDO2_OK_N + Q1001</text>
  <text x="432" y="368" class="small">hardware-qualified enable — not routed yet</text>
  <path d="M410 225 V300" class="ctrl"/><path d="M550 345 H642 V240" class="ctrl"/>

  <rect x="675" y="300" width="245" height="90" class="block next"/>
  <text x="797" y="335" class="title">UVLO / OVLO dividers</text>
  <text x="797" y="368" class="small">7.19 V to 10.87 V window — next</text>
  <path d="M797 300 V255 H700 V240" class="ctrl"/>

  <rect x="35" y="406" width="18" height="18" class="done"/><text x="62" y="421" class="legend">routed/connected</text>
  <rect x="220" y="406" width="18" height="18" class="next"/><text x="247" y="421" class="legend">schematic-defined, routing remains</text>
</svg>
